<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — A/L Master</title>
<meta name="description" content="Sign in to A/L Master to sit G.C.E. Advanced Level Physics and Chemistry MCQ papers and track your progress.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<script src="config.js"></script>
<script>try{document.documentElement.dataset.theme=localStorage.getItem('theme')||'light'}catch(e){}</script>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8054120040596132" crossorigin="anonymous"></script>
<script>
  // Intro plays once per session; skipped on later visits and for reduced-motion users.
  try{
    var seen=sessionStorage.getItem('introSeen');
    var reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if(seen||reduce) document.documentElement.classList.add('no-intro');
    else sessionStorage.setItem('introSeen','1');
  }catch(e){document.documentElement.classList.add('no-intro')}

</script>

 
<style>
  /* ---------- Intro splash ---------- */
  #intro{position:fixed;inset:0;z-index:100;display:grid;place-items:center;overflow:hidden;
    background:linear-gradient(160deg,#221c4d 0%,#3a2fa8 55%,#5a4be1 100%);color:#fff;
    animation:curtain .75s cubic-bezier(.76,0,.24,1) 1.9s forwards}
  .no-intro #intro{display:none}
  .intro-inner{text-align:center;position:relative;z-index:2}
  .intro-mark{width:92px;height:92px;margin:0 auto 22px;position:relative;display:grid;place-items:center;
    animation:pop .7s cubic-bezier(.2,1.4,.4,1) .15s both}
  .intro-mark svg{position:absolute;inset:0;transform:rotate(-90deg)}
  .intro-mark circle{fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-dasharray:264;stroke-dashoffset:264;
    animation:draw 1s ease .3s forwards}
  .intro-mark span{font-family:'Poppins',sans-serif;font-weight:600;font-size:30px;letter-spacing:-.03em;
    animation:fadeUp .5s ease .7s both}
  .intro-word{font-family:'Poppins',sans-serif;font-weight:600;font-size:30px;letter-spacing:-.02em;display:flex;justify-content:center;overflow:hidden}
  .intro-word i{font-style:normal;display:inline-block;transform:translateY(110%);
    animation:rise .55s cubic-bezier(.2,.9,.3,1) forwards;animation-delay:calc(.75s + var(--i)*.045s)}
  .intro-tag{margin-top:10px;font-size:13.5px;opacity:0;letter-spacing:.02em;color:#d9d5ff;animation:fadeIn .6s ease 1.3s forwards}
  .intro-bar{width:120px;height:3px;border-radius:99px;background:rgba(255,255,255,.2);margin:26px auto 0;overflow:hidden}
  .intro-bar b{display:block;height:100%;width:100%;background:#fff;transform:scaleX(0);transform-origin:left;animation:load 1.5s ease .3s forwards}
  .orb{position:absolute;border-radius:50%;filter:blur(60px);opacity:.35;background:#8b7dff;animation:float 6s ease-in-out infinite}
  .orb.a{width:340px;height:340px;top:-90px;left:-80px}
  .orb.b{width:280px;height:280px;bottom:-80px;right:-60px;background:#4b3dd0;animation-delay:-3s}
  #intro .skip{position:absolute;right:18px;top:calc(14px + env(safe-area-inset-top,0px));z-index:3;font-size:12.5px;
    color:#d9d5ff;background:rgba(255,255,255,.12);padding:6px 12px;border-radius:99px}

  /* ---------- Page entrance (runs after the splash lifts) ---------- */
  .enter{opacity:0;transform:translateY(18px);animation:fadeUp .7s cubic-bezier(.2,.8,.3,1) forwards;
    animation-delay:calc(var(--intro-end,2.35s) + var(--d,0s))}
  .no-intro .enter{--intro-end:.05s}
  .enter.down{transform:translateY(-14px)}
  .card.enter{animation-name:cardIn}
  @keyframes cardIn{from{opacity:0;transform:translateY(28px) scale(.97)}to{opacity:1;transform:none}}
  @keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
  @keyframes fadeIn{to{opacity:1}}
  @keyframes rise{to{transform:none}}
  @keyframes draw{to{stroke-dashoffset:0}}
  @keyframes load{to{transform:scaleX(1)}}
  @keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
  @keyframes curtain{to{transform:translateY(-100%);visibility:hidden}}
  @keyframes float{50%{transform:translate(24px,18px) scale(1.08)}}
  @media (prefers-reduced-motion:reduce){
    #intro{display:none}.enter{opacity:1;transform:none;animation:none}
  }
</style>
</head>
<body>
  <div id="intro" aria-hidden="true">
    <div class="orb a"></div><div class="orb b"></div>
    <button class="skip" id="intro-skip" type="button">Skip</button>
    <div class="intro-inner">
      <div class="intro-mark">
        <svg viewBox="0 0 92 92"><circle cx="46" cy="46" r="42"/></svg>
        <span>A/L</span>
      </div>
      <div class="intro-word"><i style="--i:0">A</i><i style="--i:1">/</i><i style="--i:2">L</i><i style="--i:3">&nbsp;</i><i style="--i:4">M</i><i style="--i:5">a</i><i style="--i:6">s</i><i style="--i:7">t</i><i style="--i:8">e</i><i style="--i:9">r</i></div>
      <p class="intro-tag">Practise smarter. Score higher.</p>
      <div class="intro-bar"><b></b></div>
    </div>
  </div>
  <div style="min-height:100vh;display:flex;flex-direction:column;padding:24px 20px">
    <div class="between enter down" style="max-width:1080px;width:100%;margin:0 auto">
      <p class="display" style="font-size:17px">A/L Master</p>
      <div class="theme-toggle" id="theme-toggle"></div>
    </div>

    <div style="flex:1;display:flex;align-items:center;justify-content:center">
      <div class="card card-pad enter" style="--d:.1s;width:100%;max-width:400px;padding:36px 32px;text-align:center">
        <h1 class="enter" style="--d:.25s;font-size:28px;line-height:1.15">Welcome back</h1>
        <p class="muted enter" style="--d:.35s;margin-top:12px;font-size:14px">
          Sign in to sit A/L Physics and Chemistry papers, save your results and track your topics.
        </p>
        <button id="signin" class="pill pill-brand enter" style="--d:.45s;margin-top:28px;width:100%;justify-content:center">
          <svg width="17" height="17" viewBox="0 0 24 24"><path fill="#fff" d="M21.6 12.2c0-.7-.1-1.3-.2-1.9H12v3.7h5.4a4.6 4.6 0 0 1-2 3v2.5h3.2c1.9-1.7 3-4.3 3-7.3" opacity=".9"/><path fill="#fff" d="M12 22c2.7 0 4.9-.9 6.6-2.4l-3.2-2.5c-.9.6-2 1-3.4 1-2.6 0-4.8-1.7-5.6-4.1H3.1v2.6A10 10 0 0 0 12 22" opacity=".75"/><path fill="#fff" d="M6.4 14a6 6 0 0 1 0-3.8V7.6H3.1a10 10 0 0 0 0 8.9z" opacity=".6"/><path fill="#fff" d="M12 5.9c1.5 0 2.8.5 3.8 1.5l2.8-2.8A10 10 0 0 0 3.1 7.6l3.3 2.6C7.2 7.6 9.4 5.9 12 5.9"/></svg>
          Continue with Google
        </button>
        <p class="muted enter" style="--d:.55s;margin-top:20px;font-size:12.5px">
          By continuing you agree to our <a href="terms.html" style="text-decoration:underline">Terms</a> and <a href="privacy.html" style="text-decoration:underline">Privacy Policy</a>.
        </p>
      </div>
    </div>
    <div id="footer" style="max-width:1080px;width:100%;margin:0 auto"></div>
  </div>
<script src="js/motion.js"></script>
<script type="module">
import { getSession, signInWithGoogle } from "./js/auth.js";
import { mountThemeToggle, mountFooter } from "./js/shell.js";
mountFooter(document.getElementById("footer"));

document.getElementById("theme-toggle").innerHTML = `
  <button data-theme-btn="light">Light</button>
  <button data-theme-btn="dark">Dark</button>`;
mountThemeToggle();

document.getElementById("signin").addEventListener("click", signInWithGoogle);

// Skip the intro: lift the curtain now and pull the page entrance forward.
document.getElementById("intro-skip")?.addEventListener("click", () => {
  const intro = document.getElementById("intro");
  intro.style.animation = "curtain .45s cubic-bezier(.76,0,.24,1) forwards";
  document.documentElement.style.setProperty("--intro-end", ".25s");
});
// Once the curtain has lifted, take the overlay out of the way entirely.
document.getElementById("intro")?.addEventListener("animationend", (e) => {
  if (e.animationName === "curtain") e.currentTarget.remove();
});

// Already signed in? Skip straight to the dashboard.
getSession().then((s) => { if (s) location.href = "dashboard.html"; });

</script>
</body>
</html>
