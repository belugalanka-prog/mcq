<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Special MCQ — Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/styles.css">
<script src="../../config.js"></script>
<script>try{document.documentElement.dataset.theme=localStorage.getItem('theme')||'light'}catch(e){}</script>
</head>
<body>
<div style="max-width:760px;margin:0 auto;padding:24px 20px">
  <div class="row" id="admin-header" style="margin-bottom:24px"></div>
  <h1 id="admin-title" style="font-size:30px;margin-bottom:6px"></h1>
  <p class="muted" style="font-size:14px;margin-bottom:20px">A Special MCQ is just a set of questions — no year, duration, or question count to fill in. Give it a name, drop the images, paste the key, and it's ready to publish.</p>

  <div class="card card-pad">
    <div class="card-head"><h2>New Special MCQ</h2></div>
    <form id="new-form" style="display:flex;flex-direction:column;gap:12px">
      <label><span class="field-label">Name</span><input class="field" name="title" placeholder="e.g. Revision quiz — waves" required></label>
      <div class="grid g2">
        <label><span class="field-label">Subject</span><select class="field" name="subject"><option value="physics">Physics</option><option value="chemistry">Chemistry</option></select></label>
        <label><span class="field-label">Group (optional)</span><input class="field" name="group_name" list="group-list" placeholder="e.g. Sunil Sir"></label>
      </div>
      <datalist id="group-list"></datalist>
      <button class="pill pill-brand" style="justify-content:center" type="submit">Create — add questions next</button>
    </form>
    <p id="new-msg" class="muted" style="margin-top:10px;font-size:13px"></p>
  </div>

  <div class="card" style="margin-top:16px">
    <div class="card-pad" style="padding-bottom:0"><div class="card-head"><h2>Existing Special MCQs</h2></div></div>
    <div id="list"></div>
  </div>
</div>
<script type="module">
import { requireStaff } from "../../js/auth.js";
import { supabase } from "../../js/supabase.js";
import { mountAdminShell } from "../../js/admin-shell.js";
import { esc } from "../../js/format.js";
import { dbError } from "../../js/db.js";

const session = await requireStaff();
if (!session) throw new Error("redirecting");
mountAdminShell("Special MCQ");

async function loadList() {
  const { data, error } = await supabase.from("papers").select("*, questions(count)")
    .eq("paper_type", "special").order("created_at", { ascending: false });
  dbError(error, "loading special MCQs");
  const groups = [...new Set((data ?? []).map(p => p.group_name).filter(Boolean))];
  document.getElementById("group-list").innerHTML = groups.map(g => `<option value="${esc(g)}">`).join("");

  const listEl = document.getElementById("list");
  if (!data?.length) {
    listEl.innerHTML = `<p class="card-pad muted" style="font-size:14px">None yet — create one above.</p>`;
    return;
  }
  listEl.innerHTML = data.map(p => `
    <a href="questions.html?paper=${p.id}" class="row" style="padding:14px 20px;border-top:1px solid var(--hairline);color:inherit;text-decoration:none">
      <div style="flex:1">
        <p style="font-size:14px;font-weight:500">${esc(p.title)}</p>
        <p class="muted" style="font-size:12.5px;margin-top:2px">${esc(p.group_name || "No group")} · ${p.subject} · ${p.questions?.[0]?.count ?? 0} questions</p>
      </div>
      <span class="pill ${p.is_published ? "pill-soft" : "pill-ghost"}">${p.is_published ? "Published" : "Draft"}</span>
    </a>`).join("");
}

document.getElementById("new-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const msg = document.getElementById("new-msg");
  const f = new FormData(e.target);
  const title = (f.get("title") || "").trim();
  if (!title) return;
  msg.textContent = "Creating…";
  const { data, error } = await supabase.from("papers").insert({
    title, subject: f.get("subject"), paper_type: "special",
    group_name: (f.get("group_name") || "").trim() || null,
    duration_minutes: null, total_questions: 0, created_by: session.user.id,
  }).select().single();
  if (dbError(error, "creating special MCQ")) { msg.textContent = ""; return; }
  location.href = `questions.html?paper=${data.id}`;
});

loadList();
</script>
</body>
</html>
