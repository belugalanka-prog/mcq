<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Duel history — A/L Master</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<script src="config.js"></script>
<script>try{document.documentElement.dataset.theme=localStorage.getItem('theme')||'light'}catch(e){}</script>
</head>
<body>
<div class="wrap">
  <div id="topbar"></div>
  <h1 style="font-size:32px">Duel history</h1>
  <p class="muted" id="sub" style="margin-top:8px;font-size:14px">Loading…</p>
  <div class="card" id="list" style="margin-top:20px"></div>
</div>
<script type="module">
import { requireUser } from "./js/auth.js";
import { supabase } from "./js/supabase.js";
import { mountRail, mountTopbar } from "./js/shell.js";
import { esc, titleCase } from "./js/format.js";
import { dbError } from "./js/db.js";

await requireUser();
mountRail();
mountTopbar({ tabs: [{ href: "duel-history.html", label: "Duels" }, { href: "dashboard.html", label: "Dashboard" }], search: false });

const { data, error } = await supabase.rpc("get_duel_history", { p_limit: 100 });
if (dbError(error, "loading your duels")) throw error;
const rows = data ?? [];
const done = rows.filter((d) => d.status === "finished");
const won = done.filter((d) => d.my_score > d.their_score).length, lost = done.filter((d) => d.my_score < d.their_score).length, draw = done.length - won - lost;
document.getElementById("sub").textContent = done.length ? `${done.length} finished · ${won} won · ${lost} lost · ${draw} drawn` : "No finished duels yet.";

const LABEL = { lobby: "Waiting", countdown: "Starting", question: "Live", discuss: "Live", abandoned: "Ended early" };
document.getElementById("list").innerHTML = rows.length ? rows.map((d, i) => {
  const live = ["lobby", "countdown", "question", "discuss"].includes(d.status);
  const res = d.status === "finished" ? (d.my_score === d.their_score ? "Draw" : d.my_score > d.their_score ? "Won" : "Lost") : LABEL[d.status];
  const win = d.status === "finished" && d.my_score > d.their_score;
  const when = new Date(d.finished_at || d.created_at).toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" });
  return `<a href="duel.html?code=${encodeURIComponent(d.code)}" class="row" style="justify-content:space-between;flex-wrap:nowrap;gap:14px;padding:16px 24px;${i ? "border-top:1px solid var(--hairline)" : ""}">
    <div style="min-width:0"><p style="font-size:15px;font-weight:600">${esc(d.paper_title)}${d.paper_year ? ` ${d.paper_year}` : ""}</p>
      <p class="num" style="font-size:14px;margin-top:4px">You ${d.my_score} — ${d.their_score} ${esc(d.opponent_name || "Waiting…")}</p>
      <p class="muted" style="font-size:12px;margin-top:4px">${titleCase(d.paper_subject || "")} · ${d.question_count} questions · ${when} · ${esc(d.code)}</p></div>
    <span class="chip" style="${win ? "background:rgba(46,212,122,.14);color:var(--ok)" : live ? "" : "background:var(--hairline);color:var(--muted)"}">${res}</span></a>`;
}).join("") : `<p class="card-pad muted">No duels yet. Open any paper and tap "Duel a friend".</p>`;
</script>
</body>
</html>
