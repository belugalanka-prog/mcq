<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard — A/L Master</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<script src="config.js"></script>
<script>try{document.documentElement.dataset.theme=localStorage.getItem('theme')||'light'}catch(e){}</script>
</head>
<body>
<div class="wrap">
  <div id="topbar"></div>

  <div class="grid" style="grid-template-columns:1.35fr 2fr">
    <div class="card card-pad" style="display:flex;flex-direction:column;justify-content:center">
      <h1 id="hero" style="font-size:34px;line-height:1.14">Hi!</h1>
      <p class="muted" style="margin-top:16px;max-width:38ch;font-size:14px">
        Pick a paper, answer under real time pressure, and get the topic breakdown the moment you submit.
      </p>
    </div>
    <div class="grid g3" id="tiles"></div>
  </div>

  <div class="grid g3" style="margin-top:16px">
    <div class="card card-pad">
      <div class="card-head"><h2>Continue where you stopped</h2></div>
      <div id="resume"><p class="muted" style="font-size:14px">Checking…</p></div>
    </div>
    <div class="card card-pad">
      <div class="card-head"><h2>Your run</h2></div>
      <div class="grid g3" id="run-stats"></div>
    </div>
    <div class="card card-pad">
      <div class="card-head"><h2>Accuracy by subject</h2></div>
      <div id="rings" style="display:flex;flex-direction:column;gap:12px"></div>
    </div>
  </div>

  <div class="grid" style="grid-template-columns:2fr 1fr;margin-top:16px">
    <div class="card card-pad">
      <div class="card-head"><h2>Recent attempts</h2><a href="results-index.html" style="font-size:13px;color:var(--brand)">See all</a></div>
      <div id="attempts"><p class="muted" style="font-size:14px">Loading…</p></div>
    </div>
    <div style="display:flex;flex-direction:column;gap:16px">
      <div id="ad-dashboard"></div>
      <div class="card card-pad">
        <div class="card-head"><h2>Leaderboard</h2></div>
        <div id="points"></div>
        <a href="leaderboard.html" class="pill pill-soft" style="width:100%;justify-content:center;margin-top:16px">See the rankings</a>
      </div>
    </div>
  </div>
</div>

<script type="module">
import { requireUser } from "./js/auth.js";
import { supabase } from "./js/supabase.js";
import { mountRail, mountTopbar, mountAdSlot } from "./js/shell.js";
import { clock, esc } from "./js/format.js";

mountRail();
mountTopbar({ tabs: [{href:"dashboard.html",label:"Dashboard"},{href:"subject.html?subject=physics",label:"Physics"},{href:"subject.html?subject=chemistry",label:"Chemistry"}], action:{href:"subject.html?subject=physics",label:"Start a paper"} });
mountAdSlot(document.getElementById("ad-dashboard"), "DASHBOARD_PROMO");

const session = await requireUser();
if (session) {
  const { user, profile } = session;
  const firstName = profile?.display_name || profile?.full_name?.split(" ")[0] || "there";
  document.getElementById("hero").innerHTML = `Hi, ${esc(firstName)}!<br>What are you sitting today?`;

  document.getElementById("tiles").innerHTML = [
    ["past","Past papers","Every A/L paper, timed","#EFEDFD"],
    ["topic","Topic papers","Drill one unit at a time","#E7F7EF"],
    ["model","Model papers","Written for this year's syllabus","#FFF1E8"],
  ].map(([type,title,note,tint]) => `
    <a href="subject.html?subject=physics&type=${type}" class="card card-pad" style="display:flex;flex-direction:column;justify-content:space-between">
      <div style="height:80px;border-radius:16px;background:${tint};display:grid;place-items:center;margin-bottom:24px">
        <span class="display" style="font-size:22px;color:var(--brand)">${title.split(" ")[0]}</span>
      </div>
      <div><p style="font-size:15px;font-weight:500">${title}</p><p class="muted" style="margin-top:4px;font-size:13px">${note}</p></div>
    </a>`).join("");

  const [{ data: stats }, { data: attempts }, { data: running }, { data: topics }] = await Promise.all([
    supabase.from("user_statistics").select("*").eq("user_id", user.id).maybeSingle(),
    supabase.from("attempts").select("id,percentage,score,time_taken_seconds,completed_at,papers(title,subject)")
      .eq("user_id", user.id).not("completed_at","is",null).order("completed_at",{ascending:false}).limit(4),
    supabase.from("attempts").select("id,expires_at,papers(title,total_questions)")
      .eq("user_id", user.id).is("completed_at",null).gt("expires_at", new Date().toISOString()).maybeSingle(),
    supabase.from("topic_performance").select("subject,accuracy").eq("user_id", user.id),
  ]);

  document.getElementById("run-stats").innerHTML = `
    <div><p class="num" style="font-size:24px;font-weight:600">${stats?.completed_papers ?? 0}</p><p class="muted" style="font-size:13px">Papers done</p></div>
    <div><p class="num" style="font-size:24px;font-weight:600">${Math.round(stats?.accuracy ?? 0)}%</p><p class="muted" style="font-size:13px">Accuracy</p></div>
    <div><p class="num" style="font-size:24px;font-weight:600;color:var(--warn)">${stats?.current_streak ?? 0}</p><p class="muted" style="font-size:13px">Day streak</p></div>`;

  document.getElementById("points").innerHTML = `
    <div class="row" style="align-items:baseline;gap:8px">
      <p class="num" style="font-size:30px;font-weight:600;color:var(--brand)">${stats?.total_points ?? 0}</p>
      <p class="muted" style="font-size:13px">points</p>
    </div>
    <p class="muted" style="margin-top:4px;font-size:13px">${stats?.correct_answers ?? 0} correct answers so far</p>`;

  function ring(value, label, color) {
    const r = 30, c = 2 * Math.PI * r, filled = (Math.min(100, Math.max(0, value)) / 100) * c;
    return `<div class="row" style="gap:16px">
      <svg width="64" height="64" viewBox="0 0 76 76" style="flex:none">
        <circle cx="38" cy="38" r="${r}" fill="none" stroke="var(--hairline)" stroke-width="8"/>
        <circle cx="38" cy="38" r="${r}" fill="none" stroke="${color}" stroke-width="8" stroke-linecap="round"
          stroke-dasharray="${filled} ${c}" transform="rotate(-90 38 38)"/>
        <text x="38" y="42" text-anchor="middle" class="num" style="font-size:16px;font-weight:600;fill:var(--ink)">${Math.round(value)}%</text>
      </svg>
      <div><p style="font-size:15px;font-weight:500">${label}</p><p class="muted" style="font-size:13px">across all attempts</p></div>
    </div>`;
  }
  const acc = (subj) => { const rows=(topics??[]).filter(t=>t.subject===subj); return rows.length? rows.reduce((a,r)=>a+Number(r.accuracy||0),0)/rows.length : 0; };
  document.getElementById("rings").innerHTML = ring(acc("physics"),"Physics","var(--brand)") + ring(acc("chemistry"),"Chemistry","var(--ok)");

  document.getElementById("resume").innerHTML = running ? `
    <a href="exam.html?attempt=${running.id}" class="row between" style="background:var(--brand-soft);border-radius:16px;padding:16px;justify-content:space-between">
      <div><p style="font-size:15px;font-weight:500">${esc(running.papers?.title)}</p>
        <p class="num" style="margin-top:4px;font-size:13px;color:var(--brand)">${clock((new Date(running.expires_at)-Date.now())/1000)} left</p></div>
      <span class="pill pill-brand">Resume</span>
    </a>` : `<p class="muted" style="font-size:14px">Nothing in progress. Start a paper and it will wait here if you get interrupted.</p>`;

  document.getElementById("attempts").innerHTML = attempts?.length ? attempts.map(a => `
    <a href="results.html?attempt=${a.id}" class="row" style="justify-content:space-between;border-top:1px solid var(--hairline);padding:14px 0;gap:16px">
      <div style="flex:1"><p style="font-size:14px;font-weight:500">${esc(a.papers?.title)}</p>
        <p class="num muted" style="margin-top:2px;font-size:12px">${clock(a.time_taken_seconds||0)} taken</p></div>
      <div class="bar" style="width:100px"><span style="width:${a.percentage||0}%"></span></div>
      <p class="num" style="font-size:14px;font-weight:600">${a.percentage}%</p>
    </a>`).join("") : `<p class="muted" style="font-size:14px">No attempts yet. Your first paper will show up here with a full breakdown.</p>`;
}
</script>
</body>
</html>
