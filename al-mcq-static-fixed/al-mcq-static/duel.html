<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Duel — A/L Master</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<script src="config.js"></script>
<script>try{document.documentElement.dataset.theme=localStorage.getItem('theme')||'light'}catch(e){}</script>
<style>
  .duel{max-width:860px;margin:0 auto}
  .players{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;margin-bottom:16px}
  .player{padding:14px 16px;border-radius:20px}
  .player.lead{border-color:var(--brand)}
  .avatar{width:40px;height:40px;border-radius:50%;object-fit:cover;background:var(--brand-soft);flex:none}
  .pname{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .score{font-family:Poppins,sans-serif;font-weight:600;font-size:26px;font-variant-numeric:tabular-nums}
  .vs{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.08em}
  .timer{margin:14px 0}.timer .bar{height:8px}.timer .bar>span{transform-origin:left;transition:background .3s}
  .qimg{background:#fff;border:1px solid var(--hairline);max-height:480px;object-fit:contain}
  .answers{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:16px}
  .answers .option{justify-content:center;padding:14px 0;flex-direction:column;gap:6px;font-weight:600}
  .answers .option:disabled{cursor:default;opacity:.6}
  .answers .option.selected{border-color:var(--brand);background:var(--brand-soft);box-shadow:0 0 0 2px var(--brand) inset}
  .answers .option.locked{opacity:1;box-shadow:0 0 0 2px var(--brand) inset}
  .lockbar{display:flex;gap:10px;align-items:center;justify-content:center;margin-top:16px;flex-wrap:wrap}
  .lockbar .pill{min-width:160px;justify-content:center}
  .big{font-family:Poppins,sans-serif;font-weight:600;font-size:88px;line-height:1;color:var(--brand)}
  .center{text-align:center;padding:44px 20px}
  .code{font-family:Poppins,sans-serif;font-weight:600;font-size:38px;letter-spacing:.3em;margin:14px 0 4px;padding-left:.3em}
  .who{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;border-radius:14px;border:1px solid var(--hairline);margin-top:8px;font-size:14px}
  .who.good{background:rgba(46,212,122,.1);border-color:var(--ok)}.who.bad{background:rgba(240,71,108,.08);border-color:var(--bad)}
  .chat{margin-top:16px;overflow:hidden}
  .chat-head{padding:12px 18px;border-bottom:1px solid var(--hairline)}
  .messages{height:190px;overflow:auto;padding:12px 16px;display:flex;flex-direction:column;gap:6px}
  .msg{max-width:78%;padding:8px 12px;border-radius:16px;background:var(--brand-soft);font-size:13px;line-height:1.4;word-break:break-word}
  .msg.me{margin-left:auto;background:var(--brand);color:#fff}
  .quick{display:flex;gap:6px;padding:0 14px 10px;overflow:auto}
  .quick button{border:1px solid var(--hairline);border-radius:999px;padding:5px 12px;font-size:13px;white-space:nowrap;background:var(--surface)}
  .quick button:hover{background:var(--brand-soft);color:var(--brand)}
  .chat-input{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--hairline)}
  #flash{margin-bottom:12px;border-radius:14px;padding:12px 16px;font-size:13px;background:rgba(240,71,108,.08);color:var(--bad)}
  .codebox{text-align:center;letter-spacing:.3em;font-size:20px;font-weight:600;text-transform:uppercase}
  #flash.ok{background:rgba(46,212,122,.12);color:var(--ok)}
  .notice{margin-bottom:12px;border-radius:14px;padding:11px 16px;font-size:13px}
  .notice.warn{background:rgba(255,178,36,.14);color:var(--warn)}
  .notice.ok{background:rgba(46,212,122,.12);color:var(--ok)}
  .notice.opp{background:rgba(255,178,36,.12);color:var(--ink);border:1px solid var(--warn);margin:0 0 12px}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--muted);margin-right:5px;vertical-align:1px}
  .dot.on{background:var(--ok)}
  .typing{min-height:18px;padding:0 16px 4px;font-size:12px;color:var(--muted);font-style:italic}
  .div{align-self:center;font-size:11px;color:var(--muted);margin:4px 0}
  .chat-fab,.chat-close{display:none}
  .chat-badge{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:var(--bad);color:#fff;font-size:11px;font-weight:600;display:grid;place-items:center}
  .rv-grid{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .rv-chip{width:40px;height:40px;border-radius:12px;border:1px solid var(--hairline);background:var(--surface);font-weight:600;font-size:14px}
  .rv-chip.good{background:rgba(46,212,122,.14);border-color:var(--ok);color:var(--ok)}
  .rv-chip.bad{background:rgba(240,71,108,.1);border-color:var(--bad);color:var(--bad)}
  .rv-chip.miss{background:var(--hairline);color:var(--muted)}
  .rv-chip.sel{box-shadow:0 0 0 2px var(--brand)}
  @media(max-width:700px){
    .duel{padding-bottom:84px}
    .chat{position:fixed;left:0;right:0;bottom:0;z-index:60;margin:0;border-radius:22px 22px 0 0;transform:translateY(105%);transition:transform .25s ease;box-shadow:0 -10px 40px rgba(0,0,0,.25)}
    .chat.open{transform:none}
    .chat .messages{height:36vh}
    .chat-fab{display:grid;place-items:center;position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:55;width:54px;height:54px;border-radius:50%;background:var(--brand);color:#fff;font-size:22px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
    .chat-close{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--hairline);color:var(--ink)}
  }
  @media(max-width:600px){.answers{grid-template-columns:repeat(5,1fr);gap:6px}.score{font-size:21px}.player{padding:10px 12px}.avatar{width:32px;height:32px}.big{font-size:64px}.code{font-size:30px}}
</style>
</head>
<body>
<div class="wrap">
  <div id="topbar"></div>
  <div class="duel">
    <div id="room-bar" class="between hidden" style="margin-bottom:16px;gap:12px">
      <div class="row" style="gap:8px;flex-wrap:wrap"><span id="code" class="chip"></span><span id="room-meta" class="chip" style="background:var(--hairline);color:var(--muted)"></span></div>
      <button id="leave-btn" class="pill pill-ghost" type="button" style="font-size:13px">Leave</button>
    </div>
    <div id="conn" class="notice warn hidden" role="status"></div>
    <div id="flash" class="hidden"></div>
    <main id="app"><div class="card card-pad center"><h2>Loading duel…</h2><p class="muted" style="margin-top:8px">Connecting to the duel room.</p></div></main>
  </div>
</div>
<script type="module">
import { requireUser } from "./js/auth.js";
import { supabase } from "./js/supabase.js";
import { mountRail, mountTopbar } from "./js/shell.js";
import { esc } from "./js/format.js";

const $ = (id) => document.getElementById(id);
const app = $("app");
const code = (new URLSearchParams(location.search).get("code") || "").toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 6);
const LETTERS = ["A", "B", "C", "D", "E"];
// The question images number their options 1–5 (like the exam and results pages), so the buttons must too.
const num = (c) => LETTERS.indexOf(c) + 1 || "?";
const cleanCode = (v) => String(v || "").toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 6);
const one = (d) => (Array.isArray(d) ? d[0] : d);

let session, duelId = null, state = null, sig = "", messages = [], msgSig = "";
let channel = null, poll = null, tickTimer = null, clockOffset = 0, advancing = "", loading = false;
let myChoice = null, choiceFor = -1, pending = false, reveal = null, revealFor = -1;
// v4: connection, presence, unread, review
let rtOk = true, failStreak = 0, connBad = false, connTimer = null, restoredTimer = null, rtWasDown = false;
let presenceReady = false, oppOnline = false, oppTyping = false, typingOn = false, typingTimer = null;
let chatOpen = false, readCount = 0, unread = 0, sharedFor = -1;
let reviewData = null, reviewIdx = null, reviewLoading = false;
const isMobile = () => window.matchMedia("(max-width:700px)").matches;

function flash(msg, kind = "") {
  const el = $("flash"); el.textContent = msg; el.classList.toggle("ok", kind === "ok"); el.classList.toggle("hidden", !msg);
  if (msg) setTimeout(() => { if (el.textContent === msg) el.classList.add("hidden"); }, 5000);
}
const now = () => Date.now() + clockOffset;
const isHost = () => (state?.me?.id || session.user.id) === state?.host_id;

/* ---------- join ---------- */
function bindCodeInput(input, onGo) {
  input.addEventListener("input", () => { input.value = cleanCode(input.value); });
  input.addEventListener("keydown", (e) => { if (e.key === "Enter") onGo(); });
}
function goToCode(value, errEl) {
  const v = cleanCode(value);
  if (v.length !== 6) { if (errEl) errEl.textContent = "Enter a 6-character code."; return; }
  location.href = `duel.html?code=${encodeURIComponent(v)}`;
}
function showJoinForm(message = "") {
  $("room-bar").classList.add("hidden");
  app.innerHTML = `<div class="card card-pad" style="max-width:480px;margin:24px auto">
    <h1 id="join-title" style="font-size:24px">Join a duel</h1>
    <div id="resume-slot"></div>
    <p class="muted" style="margin:8px 0 18px;font-size:14px">Enter the 6-character code your friend shared with you.</p>
    <input id="join-code" class="field codebox" maxlength="6" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="e.g. A7K3P9">
    <button id="join-code-btn" class="pill pill-brand" style="width:100%;justify-content:center;margin-top:12px">Join duel</button>
    <p id="join-err" style="margin-top:12px;font-size:13px;color:var(--bad)">${esc(message)}</p>
    <p class="muted" style="margin-top:18px;padding-top:16px;border-top:1px solid var(--hairline);font-size:13px">Want to host one instead? Open any paper and tap <b>Duel a friend</b> — <a href="subject.html" style="color:var(--brand)">browse papers</a>.</p></div>`;
  const input = $("join-code"), go = () => goToCode(input.value, $("join-err"));
  bindCodeInput(input, go); $("join-code-btn").addEventListener("click", go); input.focus();
  (async () => {   // already in a duel? offer to go back to it instead of looking like a fresh start
    try {
      const { data } = await supabase.rpc("get_duel_history", { p_limit: 6 });
      const live = (data || []).find((d) => ["lobby", "countdown", "question", "discuss"].includes(d.status));
      if (!live || !$("resume-slot")) return;
      $("join-title").textContent = "Join another duel";
      $("resume-slot").innerHTML = `<a class="pill pill-brand" href="duel.html?code=${encodeURIComponent(live.code)}" style="width:100%;justify-content:center;margin-top:14px">Resume your duel · ${esc(live.code)}</a>
        <p class="muted" style="font-size:12px;margin-top:8px;text-align:center">You're already in a duel. Joining another one is optional.</p>`;
    } catch (e) { /* history is optional */ }
  })();
}
async function join() {
  const { data, error } = await supabase.rpc("join_duel", { p_code: code });
  if (error) { showJoinForm(error.message); return; }
  duelId = one(data).duel_id;
  $("room-bar").classList.remove("hidden");
  await loadState();
  subscribe();
}

/* ---------- data ---------- */
async function loadState() {
  if (!duelId || loading) return;
  loading = true;
  try {
    const { data, error } = await supabase.rpc("get_duel_state", { p_duel: duelId });
    if (error) throw error;
    let s = one(data);
    if (typeof s === "string") s = JSON.parse(s);
    if (!s?.id) throw new Error("The duel state was empty. Make sure migration-duels.sql has been run completely.");
    if (s.server_now) clockOffset = new Date(s.server_now).getTime() - Date.now();
    state = s;
    state.me = state.me || { id: session.user.id, name: "You", avatar: null };
    failStreak = 0; updateConn();
    if (channel) computePresence(false);
    paintRoomBar();
    syncLocal();
    render();
    maybeAdvance();
  } catch (error) {
    console.error("Duel state error", error);
    failStreak++; updateConn();
    if (!state) {
      app.innerHTML = `<div class="card card-pad center"><h2>Could not load duel</h2><p class="muted" style="margin:12px 0">${esc(error?.message || String(error))}</p>
        <button id="retry-state" class="pill pill-brand">Retry</button> <a class="pill pill-soft" href="dashboard.html">Dashboard</a></div>`;
      $("retry-state")?.addEventListener("click", loadState);
    }
  } finally { loading = false; }
}
function paintRoomBar() {
  $("code").textContent = `Code ${state.code}`;
  $("room-meta").textContent = state.full_paper
    ? `Full paper · ${state.question_count} questions`
    : `${state.question_count} questions`;
  const over = ["finished", "abandoned"].includes(state.status);
  $("leave-btn").classList.toggle("hidden", over);
  if (state.status === "abandoned" && poll) { clearInterval(poll); poll = null; }   // nothing left to watch for
}
/* Keeps the local answer state tied to the server's, and clears it on every new question. */
function syncLocal() {
  if (state.status !== "question") return;
  if (choiceFor !== state.current_index) { myChoice = state.my_choice || null; pending = false; choiceFor = state.current_index; }
  else if (!myChoice && state.my_choice) myChoice = state.my_choice;   // page was refreshed after answering
}
const iAnswered = () => (isHost() ? state.host_answered : state.guest_answered);

function maybeAdvance() {
  if (!state || !duelId) return;
  const s = state.status;
  const due = ["countdown", "question", "discuss"].includes(s) && new Date(state.deadline).getTime() <= now();
  const bothReady = s === "discuss" && state.host_ready && state.guest_ready;
  if (!due && !bothReady) return;
  const key = `${s}:${state.current_index}`;
  if (advancing === key) return;
  advancing = key;
  supabase.rpc("advance_duel", { p_duel: duelId }).then(({ error }) => {
    if (error) {
      console.warn("advance_duel", error.message);
      if (/does not exist|schema cache|function/i.test(error.message)) flash("The duel can't move on: the database update is incomplete. Run migration-duels-v3.sql, then migration-duels-v4.sql, in Supabase. (" + error.message + ")");
      else flash("Couldn't move to the next step: " + error.message);
    }
    setTimeout(() => { if (advancing === key) advancing = ""; }, 1500); // allow a retry if nothing moved
    loadState();
  });
}

function subscribe() {
  channel = supabase.channel("duel-" + duelId, { config: { presence: { key: session.user.id } } })
    .on("postgres_changes", { event: "UPDATE", schema: "public", table: "duels", filter: `id=eq.${duelId}` }, loadState)
    .on("postgres_changes", { event: "INSERT", schema: "public", table: "duel_messages", filter: `duel_id=eq.${duelId}` }, loadMessages)
    .on("presence", { event: "sync" }, () => computePresence(true))
    .subscribe((status) => {
      if (status === "SUBSCRIBED") {
        rtOk = true; sendPresence(false);
        if (rtWasDown) { loadState(); loadMessages(); }
        rtWasDown = false; updateConn();
      } else if (["CHANNEL_ERROR", "TIMED_OUT", "CLOSED"].includes(status)) { rtOk = false; rtWasDown = true; updateConn(); }
    });
  loadMessages();
  clearInterval(poll); poll = setInterval(loadState, 2000);
  clearInterval(tickTimer); tickTimer = setInterval(tick, 200);
}
/* ---------- connection banner + presence ---------- */
function updateConn() {
  const bad = !navigator.onLine || !rtOk || failStreak >= 2, el = $("conn");
  if (!el) return;
  const text = !navigator.onLine ? "You're offline. We'll reconnect as soon as your internet is back." : "Reconnecting to the duel…";
  if (bad) {
    clearTimeout(restoredTimer);
    if (connBad) { el.className = "notice warn"; el.textContent = text; }
    else if (!connTimer) connTimer = setTimeout(() => { connTimer = null; connBad = true; el.className = "notice warn"; el.textContent = text; }, navigator.onLine ? 2500 : 0);
  } else {
    clearTimeout(connTimer); connTimer = null;
    if (connBad) {
      connBad = false; el.className = "notice ok"; el.textContent = "Connection restored";
      restoredTimer = setTimeout(() => el.classList.add("hidden"), 2500);
    } else if (el.textContent !== "Connection restored") el.classList.add("hidden");
  }
}
window.addEventListener("offline", updateConn);
window.addEventListener("online", () => { updateConn(); loadState(); loadMessages(); });

function sendPresence(typing) {
  if (!channel || !rtOk) return;
  try { Promise.resolve(channel.track({ typing: !!typing, at: Date.now() })).catch(() => {}); } catch (e) { /* presence is best-effort */ }
}
function computePresence(announce) {
  if (!channel) return;
  const oid = state?.opponent?.id, list = oid ? (channel.presenceState()[oid] || []) : [];
  const online = list.length > 0, typing = list.some((p) => p.typing);
  const wasReady = presenceReady, was = oppOnline;
  presenceReady = true; oppOnline = online;
  if (typing !== oppTyping) { oppTyping = typing; paintTyping(); }
  if (!state) return;
  if (announce && wasReady && was !== online && ["countdown", "question", "discuss"].includes(state.status)) {
    const n = state.opponent?.name || "Your friend";
    flash(online ? `${n} is back online` : `${n} disconnected`, online ? "ok" : "");
  }
  if (announce && (was !== online || !wasReady)) render();
}
function paintTyping() {
  const el = $("typing"); if (!el) return;
  el.textContent = oppTyping ? `${state?.opponent?.name || "Your friend"} is typing…` : "";
}
function typingPing() {
  if (!typingOn) { typingOn = true; sendPresence(true); }
  clearTimeout(typingTimer);
  typingTimer = setTimeout(stopTyping, 2500);
}
function stopTyping() { clearTimeout(typingTimer); if (typingOn) { typingOn = false; sendPresence(false); } }

window.addEventListener("pagehide", () => { clearInterval(poll); clearInterval(tickTimer); if (channel) supabase.removeChannel(channel); });

async function loadMessages() {
  if (!duelId) return;
  const { data, error } = await supabase.rpc("get_duel_messages", { p_duel: duelId });
  if (error) return;
  const next = data || [], s = next.map((m) => m.id).join(",");
  if (s === msgSig) return;
  msgSig = s; messages = next; renderChat(); updateUnread();
  if (reviewIdx != null) paintReview();
}
const oppMsgCount = () => messages.filter((m) => m.sender_id !== session.user.id && m.kind !== "system").length;
const chatVisible = () => !!$("chat-panel") && !document.hidden && (!isMobile() || chatOpen);
function updateUnread() {
  const total = oppMsgCount();
  if (chatVisible()) readCount = total;
  unread = Math.max(0, total - readCount);
  document.querySelectorAll(".chat-badge").forEach((b) => { b.textContent = unread > 9 ? "9+" : unread; b.classList.toggle("hidden", !unread); });
  document.title = (unread ? `(${unread}) ` : "") + "Duel — A/L Master";
}
function setChatOpen(v) {
  chatOpen = v; $("chat-panel")?.classList.toggle("open", v); updateUnread();
  if (v) { const box = $("messages"); if (box) box.scrollTop = box.scrollHeight; }
}
function renderChat() {
  const box = $("messages"); if (!box) return;
  box.innerHTML = "";
  let lastQ = null;
  messages.forEach((m) => {
    if (m.question_index !== lastQ) {
      lastQ = m.question_index;
      const dv = document.createElement("div"); dv.className = "div"; dv.textContent = lastQ < 0 ? "Lobby" : `Question ${lastQ + 1}`; box.appendChild(dv);
    }
    const row = document.createElement("div");
    row.className = "msg" + (m.sender_id === session.user.id ? " me" : "");
    row.textContent = m.body; box.appendChild(row);
  });
  box.scrollTop = box.scrollHeight;
}
async function send(body, kind = "text") {
  if (!body.trim()) return;
  const { error } = await supabase.rpc("send_duel_message", { p_duel: duelId, p_body: body, p_kind: kind });
  stopTyping();
  if (error) flash(error.message); else loadMessages();
}
async function loadReveal() {
  const idx = state.current_index;
  if (revealFor === idx && reveal) return paintReveal();
  const { data, error } = await supabase.rpc("get_duel_reveal", { p_duel: duelId });
  const el = $("reveal"); if (!el) return;
  if (error) { el.textContent = error.message; return; }
  reveal = one(data); revealFor = idx; paintReveal();
}

/* ---------- ui ---------- */
function avatar(url) { return url ? `<img class="avatar" src="${esc(url)}" alt="">` : `<div class="avatar"></div>`; }
function playersHtml() {
  const me = state.me || {}, op = state.opponent || {};
  const meHost = me.id === state.host_id;
  const my = meHost ? state.host_score : state.guest_score, their = meHost ? state.guest_score : state.host_score;
  const oppSub = !presenceReady ? "Opponent" : `<span class="dot ${oppOnline ? "on" : ""}"></span>${oppOnline ? "Online" : "Offline"}`;
  const card = (p, sub, score, lead) => `<div class="card player ${lead ? "lead" : ""}"><div class="row" style="flex-wrap:nowrap">${avatar(p.avatar)}
    <div style="min-width:0"><p class="pname">${esc(p.name || (sub === "Opponent" ? "Opponent" : sub))}</p><p class="muted" style="font-size:12px">${sub}</p></div></div>
    <p class="score" style="margin-top:6px">${score}</p></div>`;
  return `<div class="players">${card(me, "You", my, my > their)}<span class="vs">VS</span>
    ${op.id ? card(op, oppSub, their, their > my) : card({ name: "Waiting…" }, "Not joined", 0, false)}</div>`;
}
function chatHtml() {
  const badge = `<span class="chat-badge ${unread ? "" : "hidden"}">${unread > 9 ? "9+" : unread}</span>`;
  return `<div id="chat-panel" class="card chat ${chatOpen ? "open" : ""}"><div class="chat-head between"><strong style="font-size:14px">Discuss</strong><span class="muted" style="font-size:12px">Chat opens after each question</span><button id="chat-close" class="chat-close" type="button" aria-label="Close chat">✕</button></div>
    <div id="messages" class="messages"></div><div id="typing" class="typing"></div>
    <div class="quick"><button data-msg="👏">👏</button><button data-msg="🔥">🔥</button><button data-msg="😅">😅</button><button data-msg="🤔 Explain?">🤔 Explain?</button><button data-msg="Good one">Good one</button></div>
    <div class="chat-input"><input id="chat-text" class="field" maxlength="300" placeholder="Talk about the question…"><button id="chat-send" class="pill pill-brand">Send</button></div></div>
    <button id="chat-fab" class="chat-fab" type="button" aria-label="Open chat">💬${badge}</button>`;
}
function timerHtml() { return `<div class="timer"><div class="bar"><span id="timer-fill" style="width:100%"></span></div></div>`; }

function signature() {
  const s = state;
  return [s.status, s.current_index, s.host_answered, s.guest_answered, s.host_ready, s.guest_ready, s.discuss_extended,
    s.host_score, s.guest_score, s.guest_id, s.opponent?.name, myChoice, pending, s.deadline, s.rematch_code, presenceReady, oppOnline].join("|");
}
function render() {
  const next = signature();
  if (next === sig) return;
  sig = next;
  const keepText = $("chat-text")?.value || "", hadFocus = document.activeElement?.id === "chat-text";
  const s = state, host = isHost();
  let html = playersHtml();
  if (presenceReady && !oppOnline && s.opponent?.id && ["countdown", "question", "discuss"].includes(s.status)) {
    html += `<div class="notice opp">⚠ <strong>${esc(s.opponent.name || "Your friend")}</strong> is offline. Waiting for them to reconnect — after 3 missed answers in a row the duel ends.</div>`;
  }

  if (s.status === "lobby") {
    const link = `${location.origin}${location.pathname}?code=${encodeURIComponent(s.code)}`;
    html += `<div class="card center"><span class="chip">${s.guest_id ? "Friend joined" : "Waiting for your friend"}</span>
      <div class="code">${esc(s.code)}</div><p class="muted" style="font-size:13px">Share this code or the invite link.</p>
      <div class="row" style="justify-content:center;margin-top:18px">
        <button id="copy-link" class="pill pill-soft" data-link="${esc(link)}">Copy invite link</button>
        ${host ? `<button id="start" class="pill pill-brand" ${s.guest_id ? "" : "disabled"}>Start duel</button>` : `<span class="muted" style="font-size:14px">The host will start the duel.</span>`}
      </div></div>${chatHtml()}`;
  } else if (s.status === "countdown") {
    html += `<div class="card center"><div class="big" id="count">3</div><h2 style="margin-top:12px;font-size:20px">Get ready</h2>${timerHtml()}</div>`;
  } else if (s.status === "question") {
    const q = s.question, locked = iAnswered(), busy = pending;
    if (s.next_image) { const pre = new Image(); pre.src = s.next_image; }
    const oppAnswered = host ? s.guest_answered : s.host_answered;
    const oppName = esc(s.opponent?.name || "Your friend");
    const hint = locked ? `Answer locked${oppAnswered ? "" : " — waiting for " + oppName + "…"}`
      : myChoice ? "You can change your answer until you lock it." : "Tap an option (or press 1–5), then lock it in.";
    html += `<div class="card card-pad"><div class="between"><strong style="font-size:15px">Question ${s.current_index + 1} / ${s.question_count}</strong><strong id="time-left" class="num">${s.seconds}s</strong></div>
      ${timerHtml()}<img class="qimg" src="${esc(q?.image || "")}" alt="Question ${s.current_index + 1}" style="width:100%;border-radius:14px;display:block">
      <div class="answers">${LETTERS.map((x) => `<button class="option ${myChoice === x ? "selected" : ""} ${locked && myChoice === x ? "locked" : ""}" data-choice="${x}" ${locked || busy ? "disabled" : ""}><span class="option-key">${num(x)}</span></button>`).join("")}</div>
      <div class="lockbar"><button id="lock" class="pill pill-brand" ${locked || busy || !myChoice ? "disabled" : ""}>${locked ? "Locked ✓" : busy ? "Locking…" : myChoice ? "Lock answer " + num(myChoice) : "Lock answer"}</button></div>
      <p class="muted" style="text-align:center;margin-top:12px;font-size:13px">${hint} ${locked && oppAnswered ? `${oppName} has answered.` : (!locked && oppAnswered ? `${oppName} has locked in.` : "")}</p></div>`;
  } else if (s.status === "discuss") {
    const both = s.host_ready && s.guest_ready, myReady = host ? s.host_ready : s.guest_ready, oppReady = host ? s.guest_ready : s.host_ready;
    const last = s.current_index + 1 >= s.question_count, oppName = esc(s.opponent?.name || "Your friend");
    html += `<div class="card card-pad"><div class="between"><strong style="font-size:15px">Question ${s.current_index + 1} result</strong><span id="time-left" class="muted" style="font-size:12px"></span></div>
      <div id="reveal" class="muted" style="margin-top:12px">Loading result…</div>
      <div class="lockbar"><button id="ready" class="pill pill-brand" ${myReady || both ? "disabled" : ""}>${both ? "Starting…" : myReady ? `Waiting for ${oppName}…` : last ? "See final result" : "Next question →"}</button></div>
      <p class="muted" style="text-align:center;margin-top:10px;font-size:13px">${oppReady && !myReady ? `${oppName} is ready for the next one.` : "Take your time — the next question starts when you both tap Next."}</p></div>${chatHtml()}`;
  } else if (s.status === "finished" || s.status === "abandoned") {
    const meHost = s.me?.id === s.host_id, my = meHost ? s.host_score : s.guest_score, their = meHost ? s.guest_score : s.host_score;
    const ended = s.status === "abandoned";
    const title = ended ? "Duel ended early" : my === their ? "It's a draw" : my > their ? "You win!" : "You lost this one";
    html += `<div class="card center"><span class="chip">${ended ? "Someone left" : "Duel finished"}</span><h1 style="font-size:30px;margin-top:14px">${title}</h1>
      <p class="display num" style="font-size:22px;margin-top:8px">${my} — ${their}</p>
      ${ended ? `<p class="muted" style="font-size:13px;margin-top:8px">Scores shown are from the questions played so far.</p>` : ""}
      ${s.rematch_code ? `<p class="muted" style="font-size:13px;margin-top:14px">A rematch room is ready.</p>` : ""}
      <div class="row" style="justify-content:center;margin-top:20px"><button id="rematch" class="pill pill-brand">${s.rematch_code ? "Join rematch" : "Rematch"}</button><a class="pill pill-soft" href="dashboard.html">Dashboard</a></div></div>
      <div id="review"></div>${ended ? "" : chatHtml()}`;
  } else {
    html += `<div class="card center"><h2>This duel is no longer available</h2><a class="pill pill-brand" href="dashboard.html" style="margin-top:16px">Dashboard</a></div>`;
  }

  app.innerHTML = html;
  wire();
  if ($("chat-text")) { $("chat-text").value = keepText; if (hadFocus) $("chat-text").focus(); renderChat(); }
  if (s.status === "discuss") loadReveal();
  if (s.status === "finished" || s.status === "abandoned") { loadReview(); paintReview(); }
  paintTyping(); updateUnread();
  tick();
}

async function loadReview() {
  if (reviewData || reviewLoading || !duelId) return;
  reviewLoading = true;
  const { data, error } = await supabase.rpc("get_duel_review", { p_duel: duelId });
  reviewLoading = false;
  if (error) { console.warn("review", error.message); return; }
  let r = data; if (typeof r === "string") r = JSON.parse(r);
  reviewData = Array.isArray(r) ? r : [];
  paintReview();
}
function paintReview() {
  const el = $("review"); if (!el || !reviewData || !reviewData.length) { if (el) el.innerHTML = ""; return; }
  const meHost = state.me?.id === state.host_id, op = state.opponent || {};
  const mine = (r) => (meHost ? r.host : r.guest);
  const chips = reviewData.map((r) => {
    const m = mine(r), cls = !m || !m.choice ? "miss" : m.correct ? "good" : "bad";
    return `<button class="rv-chip ${cls} ${reviewIdx === r.index ? "sel" : ""}" data-rv="${r.index}" type="button">${r.index + 1}</button>`;
  }).join("");
  let detail = `<p class="muted" style="margin-top:12px;font-size:13px">Tap a question to see the answer, explanation and what you discussed.</p>`;
  const r = reviewData.find((x) => x.index === reviewIdx);
  if (r) {
    const msgs = messages.filter((m) => m.question_index === r.index && m.kind !== "system");
    detail = `<div style="margin-top:16px;padding-top:16px;border-top:1px solid var(--hairline)">
      <p style="font-size:15px;font-weight:600">Question ${r.index + 1}</p>
      <img class="qimg" src="${esc(r.image || "")}" alt="Question ${r.index + 1}" style="width:100%;border-radius:14px;margin-top:10px;display:block">
      <p style="font-size:15px;margin-top:12px">${r.correct ? `Correct answer: <strong style="color:var(--ok)">${esc(num(r.correct))}</strong>` : `<strong style="color:var(--warn)">No correct answer is set for this question</strong>`}</p>
      ${rowHtml("You", mine(r))}${rowHtml(op.name || "Opponent", meHost ? r.guest : r.host)}
      ${r.review ? `<p class="muted" style="margin-top:14px;font-size:14px;line-height:1.6;white-space:pre-wrap">${esc(r.review)}</p>` : ""}
      ${r.review_image ? `<img class="qimg" src="${esc(r.review_image)}" alt="Explanation" style="width:100%;border-radius:14px;margin-top:12px;display:block">` : ""}
      <p style="font-size:13px;font-weight:600;margin-top:16px">Chat about this question</p>
      ${msgs.length ? `<div style="display:flex;flex-direction:column;gap:6px;margin-top:8px">${msgs.map((m) => `<div class="msg ${m.sender_id === session.user.id ? "me" : ""}">${esc(m.body)}</div>`).join("")}</div>` : `<p class="muted" style="font-size:13px;margin-top:6px">No messages on this question.</p>`}
    </div>`;
  }
  el.innerHTML = `<div class="card card-pad" style="margin-top:16px"><div class="between"><strong style="font-size:15px">Review questions</strong>
    <span class="muted" style="font-size:12px"><span style="color:var(--ok)">■</span> right &nbsp;<span style="color:var(--bad)">■</span> wrong &nbsp;■ missed</span></div>
    <div class="rv-grid">${chips}</div>${detail}</div>`;
  el.querySelectorAll("[data-rv]").forEach((b) => b.addEventListener("click", () => { reviewIdx = Number(b.dataset.rv); paintReview(); }));
}

const rowHtml = (name, r) => `<div class="who ${r?.choice ? (r.correct ? "good" : "bad") : ""}"><span>${esc(name)}</span><strong>${esc(r?.choice ? num(r.choice) : "No answer")}</strong></div>`;

function paintReveal() {
  const el = $("reveal"); if (!el || !reveal) return;
  const me = state.me || {}, op = state.opponent || {}, meHost = me.id === state.host_id;
  const keys = Array.isArray(reveal.correct) ? reveal.correct : (reveal.correct ? [reveal.correct] : []);
  const answerText = !keys.length ? "—" : keys.length >= LETTERS.length ? "Any option" : keys.map(num).join(" or ");
  const row = rowHtml;
  el.className = "";
  const noKey = !keys.length;
  el.innerHTML = `<p style="font-size:15px">${noKey ? `<strong style="color:var(--warn)">No correct answer is set for this question</strong> — it scores no points for either player.` : `Correct answer: <strong style="color:var(--ok)">${esc(answerText)}</strong>`}</p>
    ${row(meHost ? "You" : op.name || "Host", reveal.host)}${row(meHost ? op.name || "Guest" : "You", reveal.guest)}
    ${reveal.review ? `<p class="muted" style="margin-top:14px;font-size:14px;line-height:1.6;white-space:pre-wrap">${esc(reveal.review)}</p>` : ""}
    ${reveal.review_image ? `<img class="qimg" src="${esc(reveal.review_image)}" alt="Explanation" style="width:100%;border-radius:14px;margin-top:12px;display:block">` : ""}
    <div style="margin-top:14px"><button id="share-exp" class="pill pill-soft" type="button" ${sharedFor === state.current_index ? "disabled" : ""}>${sharedFor === state.current_index ? "Shared in chat ✓" : "Share explanation in chat"}</button></div>`;
  $("share-exp")?.addEventListener("click", async () => {
    const n = state.current_index + 1;
    const clean = String(reveal.review || "").replace(/(https?:\/\/\S+|www\.\S+|[\w-]+\.(com|net|org|lk)\S*)/gi, "[link]").replace(/\s+/g, " ").trim();
    const body = clean ? `📘 Q${n} explanation: ${clean}`.slice(0, 295) + (clean.length > 270 ? "…" : "") : `📘 Q${n}: check the explanation image above`;
    sharedFor = state.current_index;
    await send(body.slice(0, 300));
    paintReveal(); if (isMobile()) setChatOpen(true);
  });
}

/* Runs 5x a second: updates the countdown bar without touching the rest of the DOM. */
function tick() {
  if (!state || !state.deadline) return;
  const s = state.status; if (!["countdown", "question", "discuss"].includes(s)) return;
  const left = Math.max(0, new Date(state.deadline).getTime() - now());
  const total = s === "question" ? state.seconds * 1000 : s === "countdown" ? 3000 : state.discuss_seconds * 1000 + (state.discuss_extended ? 10000 : 0);
  const pct = Math.max(0, Math.min(1, left / total)), fill = $("timer-fill");
  if (fill) { fill.style.width = "100%"; fill.style.transform = `scaleX(${pct})`; fill.style.background = pct < .1 ? "var(--bad)" : pct < .25 ? "var(--warn)" : "var(--brand)"; }
  const label = $("time-left");
  if (label) label.textContent = s === "discuss" ? (left < 60000 ? `Auto-next in ${Math.ceil(left / 1000)}s` : "") : `${Math.ceil(left / 1000)}s`;
  const c = $("count"); if (c) c.textContent = Math.max(1, Math.ceil(left / 1000));
  if (left <= 0) maybeAdvance();
}

function wire() {
  $("start")?.addEventListener("click", async (e) => {
    e.target.disabled = true;
    const { error } = await supabase.rpc("start_duel", { p_duel: duelId });
    if (error) { flash(error.message); e.target.disabled = false; } else loadState();
  });
  $("copy-link")?.addEventListener("click", async (e) => {
    try { await navigator.clipboard.writeText(e.target.dataset.link); e.target.textContent = "Link copied"; } catch { e.target.textContent = "Copy failed"; }
  });
  document.querySelectorAll("[data-choice]").forEach((b) => b.addEventListener("click", () => {
    if (pending || iAnswered() || state.status !== "question") return;
    const c = b.dataset.choice;
    if (c === myChoice) return;
    myChoice = c; choiceFor = state.current_index; render();               // instant, changeable
    supabase.rpc("save_duel_choice", { p_duel: duelId, p_question: state.question.id, p_choice: c }); // remembered on the server (refresh + time-out safe)
  }));
  $("lock")?.addEventListener("click", lockAnswer);
  $("ready")?.addEventListener("click", async () => {
    const { error } = await supabase.rpc("duel_ready", { p_duel: duelId });
    if (error) flash(error.message);
    loadState();
  });
  $("extend")?.addEventListener("click", async () => {
    const { error } = await supabase.rpc("extend_discuss", { p_duel: duelId });
    if (error) flash(error.message);
    loadState();
  });
  const sendNow = () => { const i = $("chat-text"); const v = i.value; i.value = ""; send(v); };
  $("chat-send")?.addEventListener("click", sendNow);
  $("chat-text")?.addEventListener("keydown", (e) => { if (e.key === "Enter") sendNow(); });
  $("chat-text")?.addEventListener("input", typingPing);
  $("chat-text")?.addEventListener("blur", stopTyping);
  $("chat-fab")?.addEventListener("click", () => setChatOpen(!chatOpen));
  $("chat-close")?.addEventListener("click", () => setChatOpen(false));
  document.querySelectorAll("[data-msg]").forEach((b) => b.addEventListener("click", () => send(b.dataset.msg, "reaction")));
  $("rematch")?.addEventListener("click", async (e) => {
    e.target.disabled = true;
    const { data, error } = await supabase.rpc("create_rematch", { p_duel: duelId });
    if (error) { flash(error.message); e.target.disabled = false; } else location.href = `duel.html?code=${encodeURIComponent(one(data).code)}`;
  });
}

async function lockAnswer() {
  if (!state || state.status !== "question" || pending || iAnswered() || !myChoice) return;
  pending = true; render();
  const { error } = await supabase.rpc("submit_duel_answer", { p_duel: duelId, p_question: state.question.id, p_choice: myChoice });
  if (error) { flash(error.message); if (/locked|time/i.test(error.message)) myChoice = null; }
  pending = false; sig = ""; await loadState();
}

/* ---------- leave + keyboard ---------- */
async function leave() {
  const inLobby = state?.status === "lobby";
  const msg = inLobby ? "Leave this lobby?" : "Leave now? The duel will end for both of you.";
  if (!confirm(msg)) return;
  const btn = $("leave-btn"); btn.disabled = true;
  const { error } = await supabase.rpc("leave_duel", { p_duel: duelId });
  btn.disabled = false;
  if (error) { flash(error.message); return; }
  location.href = "dashboard.html";
}
document.addEventListener("keydown", (e) => {
  if (!state || pending || e.ctrlKey || e.metaKey || e.altKey) return;
  if (/^(INPUT|TEXTAREA|SELECT|BUTTON)$/.test(document.activeElement?.tagName || "") && e.key === "Enter") return;
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName || "")) return;
  if (state.status === "question" && !iAnswered()) {
    const i = Number(e.key);
    if (i >= 1 && i <= 5) document.querySelector(`[data-choice="${LETTERS[i - 1]}"]`)?.click();
    else if (e.key === "Enter") lockAnswer();
  } else if (state.status === "discuss" && e.key === "Enter") {
    $("ready")?.click();
  }
});
// Coming back to the tab (phones especially) should catch up immediately.
document.addEventListener("visibilitychange", () => { if (!document.hidden && duelId) { loadState(); loadMessages(); updateUnread(); } });

/* ---------- boot ---------- */
(async () => {
  try {
    session = await requireUser();
    if (!session) return;
    mountRail();
    mountTopbar({ tabs: [{ href: "dashboard.html", label: "Dashboard" }, { href: "subject.html", label: "Papers" }], search: false });
    $("leave-btn").addEventListener("click", leave);
    if (code) await join(); else showJoinForm();
  } catch (error) {
    console.error("Duel bootstrap error", error);
    app.innerHTML = `<div class="card card-pad center"><h2>Unable to open duel</h2><p class="muted" style="margin:12px 0">${esc(error?.message || String(error))}</p><button id="retry-page" class="pill pill-brand">Retry</button></div>`;
    $("retry-page")?.addEventListener("click", () => location.reload());
  }
})();
</script>
</body>
</html>
